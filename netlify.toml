[build]
  command = "npm run build"
  publish = "dist"

[[headers]]
  for = "/.well-known/apple-app-site-association"
  [headers.values]
    Content-Type = "application/json"

[[redirects]]
  from = "/battle/*"
  to = "/"
  status = 302

# SPA fallback (Vite output is a single index.html)
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
