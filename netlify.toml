[build]
  command = "npm run build"
  publish = "dist"

# Vite 6+ needs modern Node (Web Crypto on globalThis). Netlify’s old default breaks with:
# TypeError: crypto.getRandomValues is not a function
[build.environment]
  NODE_VERSION = "20"

[[headers]]
  for = "/.well-known/apple-app-site-association"
  [headers.values]
    Content-Type = "application/json"

[[redirects]]
  from = "/battle/*"
  to = "/"
  status = 302

# SPA fallback (Vite output is a single index.html)
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
